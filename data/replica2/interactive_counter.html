<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interactivo Moderno</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4' },
                            '50%': { opacity: '0.8' },
                        },
                        popIn: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    },
                    animation: {
                        pulseGlow: 'pulseGlow 3s infinite ease-in-out',
                        popIn: 'popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions on interactive counter elements */
        .counter-value {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }

        .btn-bounce {
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-bounce:active {
            transform: scale(0.92);
        }

        /* Glassmorphism panel effect */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 select-none overflow-hidden relative">

    <!-- Ambient background glow elements -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 sm:w-96 sm:h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none animate-pulseGlow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-60 h-60 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none animate-pulseGlow" style="animation-delay: 1.5s;"></div>

    <!-- Header / Title -->
    <header class="w-full max-w-md text-center pt-6 z-10">
        <h1 class="text-xs font-semibold uppercase tracking-widest text-indigo-400 mb-1">Herramienta Interactiva</h1>
        <p class="text-2xl font-bold tracking-tight text-white">Contador Digital</p>
    </header>

    <!-- Main Counter Card Container -->
    <main class="w-full max-w-sm z-10 my-auto">
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden">
            
            <!-- Dynamic Status Badge -->
            <div id="statusBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium tracking-wide bg-slate-800 text-slate-400 mb-6 transition-all duration-300">
                <span id="badgeDot" class="w-2 h-2 rounded-full bg-slate-500 mr-2"></span>
                <span id="badgeText">Neutro</span>
            </div>

            <!-- Counter Display -->
            <div class="relative h-32 flex items-center justify-center my-2">
                <span id="counterValue" class="counter-value text-7xl sm:text-8xl font-black tracking-tight text-white drop-shadow-md">
                    0
                </span>
            </div>

            <!-- Interactive Buttons Grid -->
            <div class="grid grid-cols-3 gap-3 sm:gap-4 mt-8">
                <!-- Decrement Button -->
                <button id="btnDecrement" 
                        class="btn-bounce h-14 rounded-2xl bg-slate-800 hover:bg-rose-500/20 border border-slate-700/60 hover:border-rose-500/50 text-rose-400 font-bold text-2xl flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-rose-500/40"
                        aria-label="Decrementar valor">
                    -
                </button>

                <!-- Reset Button -->
                <button id="btnReset" 
                        class="btn-bounce h-14 rounded-2xl bg-slate-800 hover:bg-amber-500/20 border border-slate-700/60 hover:border-amber-500/50 text-amber-400 font-semibold text-sm tracking-wider uppercase flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-amber-500/40"
                        aria-label="Resetear contador">
                    Reset
                </button>

                <!-- Increment Button -->
                <button id="btnIncrement" 
                        class="btn-bounce h-14 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-2xl flex items-center justify-center shadow-lg shadow-indigo-600/30 border border-indigo-400/30 focus:outline-none focus:ring-2 focus:ring-indigo-400/50"
                        aria-label="Incrementar valor">
                    +
                </button>
            </div>

            <!-- Quick Adjust Controls -->
            <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-800/80 text-xs text-slate-400">
                <button id="btnSubTen" class="hover:text-slate-200 transition-colors py-1 px-2 rounded hover:bg-slate-800">-10</button>
                <span class="text-slate-600">|</span>
                <button id="btnAddTen" class="hover:text-slate-200 transition-colors py-1 px-2 rounded hover:bg-slate-800">+10</button>
            </div>
        </div>
    </main>

    <!-- Footer / Instructions -->
    <footer class="w-full max-w-md text-center pb-4 text-xs text-slate-500 z-10">
        <p class="hidden sm:block">Sugerencia: Puedes usar el teclado (<kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">+</kbd>, <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">-</kbd>, <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">R</kbd>)</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Application State
            let count = 0;

            // DOM Elements Reference
            const counterValueEl = document.getElementById('counterValue');
            const statusBadgeEl = document.getElementById('statusBadge');
            const badgeDotEl = document.getElementById('badgeDot');
            const badgeTextEl = document.getElementById('badgeText');

            const btnDecrement = document.getElementById('btnDecrement');
            const btnReset = document.getElementById('btnReset');
            const btnIncrement = document.getElementById('btnIncrement');
            const btnSubTen = document.getElementById('btnSubTen');
            const btnAddTen = document.getElementById('btnAddTen');

            /**
             * Updates UI representation based on current state
             * Handles text change, color mapping, and pop animations
             */
            function updateUI(delta = 0) {
                // Set value text
                counterValueEl.textContent = count;

                // Animate value scale pop effect
                counterValueEl.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    counterValueEl.style.transform = 'scale(1)';
                }, 150);

                // Update text color & status badge based on count polarity
                if (count > 0) {
                    counterValueEl.className = 'counter-value text-7xl sm:text-8xl font-black tracking-tight text-emerald-400 drop-shadow-[0_0_20px_rgba(52,211,153,0.3)]';
                    
                    statusBadgeEl.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium tracking-wide bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 mb-6 transition-all duration-300';
                    badgeDotEl.className = 'w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse';
                    badgeTextEl.textContent = 'Positivo';

                } else if (count < 0) {
                    counterValueEl.className = 'counter-value text-7xl sm:text-8xl font-black tracking-tight text-rose-400 drop-shadow-[0_0_20px_rgba(251,113,133,0.3)]';
                    
                    statusBadgeEl.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium tracking-wide bg-rose-500/10 border border-rose-500/30 text-rose-400 mb-6 transition-all duration-300';
                    badgeDotEl.className = 'w-2 h-2 rounded-full bg-rose-400 mr-2 animate-pulse';
                    badgeTextEl.textContent = 'Negativo';

                } else {
                    counterValueEl.className = 'counter-value text-7xl sm:text-8xl font-black tracking-tight text-white drop-shadow-md';
                    
                    statusBadgeEl.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium tracking-wide bg-slate-800 border border-slate-700/50 text-slate-400 mb-6 transition-all duration-300';
                    badgeDotEl.className = 'w-2 h-2 rounded-full bg-slate-500 mr-2';
                    badgeTextEl.textContent = 'Cero';
                }
            }

            // Event Handlers
            function increment(amount = 1) {
                count += amount;
                updateUI(amount);
            }

            function decrement(amount = 1) {
                count -= amount;
                updateUI(-amount);
            }

            function reset() {
                if (count !== 0) {
                    count = 0;
                    updateUI(0);
                }
            }

            // Click Listener Bindings
            btnIncrement.addEventListener('click', () => increment(1));
            btnDecrement.addEventListener('click', () => decrement(1));
            btnReset.addEventListener('click', reset);
            btnAddTen.addEventListener('click', () => increment(10));
            btnSubTen.addEventListener('click', () => decrement(10));

            // Keyboard Shortcuts
            document.addEventListener('keydown', (event) => {
                if (event.key === '+' || event.key === '=') {
                    increment(1);
                } else if (event.key === '-' || event.key === '_') {
                    decrement(1);
                } else if (event.key === 'r' || event.key === 'R') {
                    reset();
                } else if (event.key === 'ArrowUp') {
                    increment(1);
                } else if (event.key === 'ArrowDown') {
                    decrement(1);
                }
            });
        });
    </script>
</body>
</html>
