services:
  # --- BACKEND (API Express & Logs) ---
  log-pulse-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log-pulse-backend
    restart: unless-stopped
    ports:
      - "4001:4000"
    networks:
      - monitor-net
    environment:
      - PORT=4000
      - NODE_ENV=production

  # --- FRONTEND (Next.js Dashboard) ---
  log-pulse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log-pulse-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - monitor-net
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4001
    depends_on:
      - log-pulse-backend

networks:
  monitor-net:
    external: true