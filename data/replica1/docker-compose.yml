services:
  crud-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: crud
      MYSQL_USER: crud
      MYSQL_PASSWORD: crud
    volumes:
      - crud_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      mesh.app: "crud-demo"
      mesh.role: "db"

  crud-api:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    command: sh -c "npm install && node server.js"
    environment:
      DB_HOST: crud-db
      DB_USER: crud
      DB_PASSWORD: crud
      DB_NAME: crud
    depends_on:
      crud-db:
        condition: service_healthy
    labels:
      mesh.app: "crud-demo"
      mesh.role: "api"

  crud-web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3100:3000"
    depends_on:
      - crud-api
    labels:
      mesh.app: "crud-demo"
      mesh.role: "frontend"

volumes:
  crud_db:
